language: zh
workspace: ./workspace
log_dir: ./temp/model_responses
max_turns: 300

tools:
  # 注册完整工具面；具体运行可用性由 Component Map 和各工具健康检查判断。
  enabled_groups: [*]

reflection:
  # SessionEnd 只写轻量 trigger；反思任务由本地 daemon 批量消费。
  auto_enqueue: true
  debounce_seconds: 30
  max_attempts: 3

llm:
  active_profile: deepseek
  # fallback_profiles: [local]
  profiles:
    deepseek:
      provider: openai
      name: deepseek
      api_key: ${DEEPSEEK_API_KEY}
      api_base: https://api.deepseek.com
      model: deepseek-v4-pro
      stream: true
      connect_timeout_seconds: 10
      read_timeout_seconds: 120
      max_retries: 2

    local:
      provider: openai
      name: local
      api_key: ${LOCAL_OPENAI_API_KEY}
      api_base: http://127.0.0.1:11434/v1
      model: qwen3-coder
      stream: true
      connect_timeout_seconds: 10
      read_timeout_seconds: 120
      max_retries: 1

context:
  max_history_messages: 40
  keep_recent_tool_results: 2
  max_tool_result_chars: 12000
  compacted_tool_head_chars: 4000
  compacted_tool_tail_chars: 4000
  max_request_chars: 100000
  max_session_memory_chars: 20000
  max_compact_summary_chars: 60000
  enable_micro_compact: true

observability:
  # 每次 REPL 普通任务结束后异步刷新本地 tuning report，不额外调用 LLM。
  auto_refresh: true
  auto_refresh_limit: 50
  langfuse:
    enabled: ${COHORT_LANGFUSE_ENABLED}
    host: ${LANGFUSE_HOST}
    public_key: ${LANGFUSE_PUBLIC_KEY}
    secret_key: ${LANGFUSE_SECRET_KEY}
    environment: ${COHORT_ENV}
    release: ${COHORT_RELEASE}
    timeout_seconds: 2
