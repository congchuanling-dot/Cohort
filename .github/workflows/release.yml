name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build macOS binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build darwin binaries
        shell: bash
        run: |
          mkdir -p dist
          commit="${GITHUB_SHA::12}"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X cohort/internal/version.Version=${{ steps.tag.outputs.tag }} -X cohort/internal/version.Commit=${commit} -X cohort/internal/version.BuiltAt=${built_at}"
          for arch in arm64 amd64; do
            output="dist/cohort-darwin-${arch}"
            GOOS=darwin GOARCH="${arch}" CGO_ENABLED=0 \
              go build -trimpath -ldflags="${ldflags}" -o "${output}" ./cmd/cohort
            (cd dist && shasum -a 256 "cohort-darwin-${arch}" > "cohort-darwin-${arch}.sha256")
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --title "${RELEASE_TAG}" \
              --notes "Cohort ${RELEASE_TAG}"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Set npm package version from release tag
        working-directory: packages/npm
        shell: bash
        run: |
          version="${{ steps.tag.outputs.tag }}"
          version="${version#v}"
          npm version "${version}" --no-git-tag-version --allow-same-version

      - name: Validate npm package
        working-directory: packages/npm
        env:
          COHORT_NPM_RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          COHORT_NPM_TARGET_PLATFORM: darwin
          COHORT_NPM_TARGET_ARCH: arm64
        run: |
          npm test
          npm pack --dry-run

      - name: Publish npm package
        working-directory: packages/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          COHORT_NPM_RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: npm publish --access public --tag latest
